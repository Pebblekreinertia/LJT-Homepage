name: Validate Jekyll Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "/LJT-Homepage"
        env:
          JEKYLL_ENV: production
      - name: Verify rendered content
        run: |
          set -e
          echo "== home page (about) checks =="
          test -f _site/index.html
          grep -q "Junteng Liu" _site/index.html
          grep -q "SynLogic: Synthesizing Verifiable Reasoning Data at Scale" _site/index.html
          grep -q "On the Perception Bottleneck of VLMs for Chart Understanding" _site/index.html
          grep -q "On the Universal Truthfulness Hyperplane Inside LLMs" _site/index.html
          grep -q "In-Context Sharpness as Alerts" _site/index.html
          grep -q "C-Eval: A Multi-Level Multi-Discipline Chinese Evaluation Suite" _site/index.html
          grep -q "Composing Parameter-Efficient Modules with Arithmetic Operations" _site/index.html
          grep -q "jliugi@connect.ust.hk" _site/index.html
          grep -q "Zhiyuan Honor Scholarship" _site/index.html
          grep -q "MINIMAX" _site/index.html
          grep -q "Tencent WXG" _site/index.html
          grep -q "Shanghai AI Lab" _site/index.html
          grep -q "Vicent0205" _site/index.html
          grep -q "junteng88716710" _site/index.html
          echo "== publications page checks =="
          test -f _site/publications/index.html
          grep -q "SynLogic" _site/publications/index.html
          grep -q "Preprints" _site/publications/index.html
          grep -q "Conference Papers" _site/publications/index.html
          echo "== publication detail pages =="
          test -f _site/publications/2025-02-01-synlogic/index.html
          test -f _site/publications/2023-12-02-c-eval/index.html
          echo "== CV page checks =="
          test -f _site/cv/index.html
          grep -q "Zhiyuan Honor Scholarship" _site/cv/index.html
          grep -q "Composing Parameter-Efficient Modules" _site/cv/index.html
          echo "== removed empty section pages =="
          test ! -e _site/talks/index.html
          test ! -e _site/teaching/index.html
          test ! -e _site/portfolio/index.html
          test ! -e _site/year-archive/index.html
          echo "== no template demo text remains =="
          if grep -rq "Paper Title Number" _site/; then echo "FOUND DEMO PUB"; exit 1; fi
          if grep -rq "GitHub University" _site/; then echo "FOUND DEMO SCHOOL"; exit 1; fi
          if grep -rq "Short biography for the left-hand sidebar" _site/; then echo "FOUND DEMO BIO"; exit 1; fi
          if grep -rq "Red Brick University" _site/; then echo "FOUND DEMO EMPLOYER"; exit 1; fi
          echo "ALL CONTENT CHECKS PASSED"
